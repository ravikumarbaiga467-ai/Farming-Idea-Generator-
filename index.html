<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>गाँव बिज़नेस एडवाइज़र AI</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans Devanagari",sans-serif;
    background:#f3f7f1;
    color:#18321f;
}

.hero{
    background:linear-gradient(135deg,#176b3a,#2f9e5b);
    color:white;
    padding:32px 18px;
    text-align:center;
}

.hero h1{
    margin:0 0 8px;
    font-size:30px;
}

.hero p{
    margin:0;
}

.container{
    max-width:900px;
    margin:20px auto;
    padding:0 14px;
}

.card{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 6px 25px rgba(0,0,0,.08);
}

label{
    display:block;
    font-weight:bold;
    margin:12px 0 6px;
}

input,
select,
textarea{
    width:100%;
    padding:13px;
    border:1px solid #ccd8cd;
    border-radius:10px;
    font-size:16px;
}

textarea{
    min-height:120px;
    resize:vertical;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

button{
    border:0;
    border-radius:11px;
    padding:12px 16px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.primary{
    background:#176b3a;
    color:white;
    width:100%;
    margin-top:16px;
}

.primary:disabled{
    opacity:.6;
}

.chips{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:10px;
}

.chip{
    background:#e8f5eb;
    color:#176b3a;
    border-radius:999px;
    padding:9px 12px;
}

#status{
    margin-top:12px;
    text-align:center;
    color:#667;
}

#result{
    white-space:pre-wrap;
    line-height:1.8;
    font-size:16px;
}

.footer{
    text-align:center;
    color:#68736a;
    font-size:13px;
    padding:10px 0 30px;
}

@media(max-width:650px){

    .grid{
        grid-template-columns:1fr;
    }

    .hero h1{
        font-size:25px;
    }

}
</style>
</head>

<body>

<header class="hero">

<h1>🌾 गाँव बिज़नेस एडवाइज़र AI</h1>

<p>
खेती, पशुपालन और ग्रामीण बिज़नेस के लिए AI सलाह
</p>

</header>


<main class="container">

<section class="card">

<h2>💡 अपना बिज़नेस आइडिया बनाइए</h2>

<p>
अपनी जानकारी भरें और AI से आसान हिंदी में योजना पाएं।
</p>


<div class="grid">

<div>

<label>📍 गाँव / जिला</label>

<input
id="location"
placeholder="जैसे: सीहोर, मध्य प्रदेश">

</div>


<div>

<label>💰 आपका बजट</label>

<select id="budget">

<option value="10000">
₹10,000 तक
</option>

<option value="25000">
₹25,000 तक
</option>

<option value="50000">
₹50,000 तक
</option>

<option value="100000">
₹1 लाख तक
</option>

<option value="250000">
₹2.5 लाख तक
</option>

<option value="500000">
₹5 लाख तक
</option>

</select>

</div>

</div>


<label>🌱 रुचि का क्षेत्र</label>

<select id="category">

<option>खेती</option>

<option>सब्जी की खेती</option>

<option>फल की खेती</option>

<option>मशरूम उत्पादन</option>

<option>पशुपालन</option>

<option>डेयरी बिज़नेस</option>

<option>मुर्गी पालन</option>

<option>बकरी पालन</option>

<option>मधुमक्खी पालन</option>

<option>मछली पालन</option>

<option>कृषि प्रसंस्करण</option>

<option>गाँव का अन्य बिज़नेस</option>

</select>


<label>🌾 जमीन / संसाधन</label>

<input
id="land"
placeholder="जैसे: 2 एकड़ जमीन, पानी की सुविधा है">


<label>📝 आपकी जरूरत</label>

<textarea
id="question"
placeholder="जैसे: कम जोखिम में अच्छा बिज़नेस बताइए">
</textarea>


<div class="chips">

<button
class="chip"
onclick="quickIdea('कम लागत में जल्दी शुरू होने वाला बिज़नेस बताइए')">

कम लागत

</button>


<button
class="chip"
onclick="quickIdea('मेरी जमीन के हिसाब से खेती का सुझाव दें')">

जमीन के हिसाब से

</button>


<button
class="chip"
onclick="quickIdea('कम जोखिम वाला बिज़नेस बताइए')">

कम जोखिम

</button>

</div>


<button
id="askBtn"
class="primary"
onclick="askAI()">

🤖 AI से योजना बनवाएँ

</button>


<div id="status"></div>

</section>



<section class="card">

<h2>📋 AI की सलाह</h2>

<div id="result">

आपकी जानकारी मिलने के बाद यहाँ सुझाव दिखाई देगा।

</div>

</section>


<div class="footer">

गाँव बिज़नेस एडवाइज़र AI © 2026

<br>

यह जानकारी सामान्य मार्गदर्शन के लिए है।

</div>

</main>



<script>

function quickIdea(text){

    document.getElementById("question").value = text;

}


async function askAI(){

    const button =
        document.getElementById("askBtn");

    const status =
        document.getElementById("status");

    const result =
        document.getElementById("result");


    const location =
        document.getElementById("location").value.trim();

    const budget =
        document.getElementById("budget").value;

    const category =
        document.getElementById("category").value;

    const land =
        document.getElementById("land").value.trim();

    const question =
        document.getElementById("question").value.trim();


    if(!question){

        result.textContent =
            "कृपया अपनी जरूरत लिखें।";

        return;

    }


    button.disabled = true;

    status.textContent =
        "⏳ AI आपकी योजना तैयार कर रहा है...";

    result.textContent = "";


    const message = `

मैं भारत के गाँव में रहने वाला व्यक्ति हूँ।

गाँव/जिला:
${location || "जानकारी नहीं दी गई"}

बजट:
₹${budget}

रुचि:
${category}

जमीन और संसाधन:
${land || "जानकारी नहीं दी गई"}

मेरी जरूरत:
${question}

मेरे लिए व्यावहारिक ग्रामीण बिज़नेस या खेती की योजना हिंदी में बनाइए।

`;


    try{

        const response =
            await fetch("/api/chat",{

                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:JSON.stringify({
                    message:message
                })

            });


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error ||
                "AI response error"
            );

        }


        result.textContent =
            data.reply ||
            "जवाब नहीं मिला।";


        status.textContent =
            "✅ योजना तैयार है";


    }catch(error){

        console.error(error);

        status.textContent =
            "❌ जवाब प्राप्त नहीं हुआ";


        result.textContent =
            "समस्या: " +
            error.message +

            "\n\nVercel में GROQ_API_KEY सेट है या नहीं जाँचें।";


    }finally{

        button.disabled = false;

    }

}

</script>

</body>
</html>
